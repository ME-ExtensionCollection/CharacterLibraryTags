<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character Library dev harness</title>
    <link rel="icon" href="data:," />
    <style>
      /* A small subset of Marinara's dark theme tokens (packages/client/src/styles/globals.css). */
      :root {
        --background: #050312;
        --foreground: #d4d4d4;
        --card: #141414d9;
        --primary: #ec4b97;
        --secondary: #1a1a2e;
        --muted: #1a1a2e;
        --muted-foreground: #a1a1aa;
        --accent: #2a1a3e;
        --destructive: #ff6b9d;
        --warning: #eeaa37;
        --border: color-mix(in srgb, var(--primary) 20%, transparent);
        --radius: 0.75rem;
        --marinara-chat-chrome-accent: var(--primary);
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, sans-serif;
      }
      header[data-component="TopBar"] {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid var(--border);
      }
      nav[data-tour="panel-buttons"] {
        display: flex;
        gap: 0.25rem;
      }
      nav button {
        display: flex;
        width: 2rem;
        height: 2rem;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 0.5rem;
        background: transparent;
        color: var(--muted-foreground);
        cursor: pointer;
      }
      nav button:hover {
        background: var(--accent);
      }
      main {
        max-width: 48rem;
        padding: 1rem;
        line-height: 1.5;
      }
      code {
        color: var(--primary);
      }
      
      .mari-chrome-control, .mari-chrome-field, .mari-chrome-segmented__button {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 0.8rem;
        padding: 0.3rem 0.5rem;
      }
      .mari-chrome-control--selected { border-color: var(--primary); }
      .mock-panel { max-width: 48rem; margin: 0 1rem; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.75rem; }
      .mari-chrome-segmented { display: flex; gap: 0.25rem; }
      .mock-library { position: fixed; inset: 3rem 0 0 0; background: var(--background); overflow: auto; padding: 1rem; z-index: 10; }
      .mock-library-header-row { display: flex; gap: 1rem; align-items: flex-start; }
      .mock-library-toolbar { display: flex; gap: 0.5rem; }
      .mock-library-body { display: grid; grid-template-columns: 1fr 18rem; gap: 1rem; }
      .mock-library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: 0.5rem; }
      .mock-library-card { padding: 1rem 0.5rem; border: 1px solid var(--border); border-radius: 0.6rem; background: var(--card); color: inherit; }
      .mock-overlay { position: fixed; inset: 0; display: grid; place-items: center; background: #000a; z-index: 100000; }
      .mock-overlay > div { padding: 2rem; background: var(--card); border: 1px solid var(--primary); border-radius: 1rem; }
    </style>
    <link rel="stylesheet" href="/dev/build/extension.css" />
  </head>
  <body>
    <header data-component="TopBar">
      <strong>Mock Marinara</strong>
      <nav data-tour="panel-buttons" aria-label="Panel navigation">
        <button data-tour="panel-characters" title="Characters">C</button>
        <button data-tour="panel-settings" title="Settings">S</button>
      </nav>
    </header>
    <main>
      <p>Dev harness for the Character Library extension. Mock data only (<code>dev/mock-library.mjs</code>).</p>
      <p>Left-click <b>Open Library</b> for the mock stock library; right-click it for the manager.</p>
      <p>Add <code>?ctm=1</code> to the URL for a fake Tag Merger API, <code>?react=1</code> for a fake React root with Marinara's UI store.</p>
    </main>
    <script src="/dev/mock-tag-merger.js"></script>
    <script src="/dev/mock-library-view.js"></script>
    <script src="/dev/mock-react.js"></script>
    <script src="/dev/mock-marinara.js"></script>
    <script src="/dev/build/page-runtime.js"></script>
  </body>
</html>
